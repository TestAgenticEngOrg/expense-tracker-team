openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Stores and serves each employee's own saved expenses and receipts.
servers:
  - url: /
paths:
  /me/expenses:
    get:
      operationId: listMyExpenses
      summary: The caller's saved expenses, with a running total
      security:
        - oauth2: [expenses:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's own saved expenses
          content:
            application/json:
              schema:
                type: object
                required: [count, data, runningTotal]
                properties:
                  count: { type: integer, description: total matching expenses }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  runningTotal: { type: number, format: double, description: sum of the total of every one of the caller's saved expenses }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
        '401':
          description: No valid session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitExpense
      summary: Save a new expense with its receipt
      security:
        - oauth2: [expenses:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewExpense' }
      responses:
        '201':
          description: The saved expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          description: Missing or invalid merchant, date, total or receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: No valid session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/expenses/{expenseId}:
    get:
      operationId: getMyExpense
      summary: One of the caller's own saved expenses
      security:
        - oauth2: [expenses:read]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The saved expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404':
          description: No such expense for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: No valid session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/expenses/{expenseId}/receipt:
    get:
      operationId: getMyExpenseReceipt
      summary: The original receipt file for one of the caller's own expenses
      security:
        - oauth2: [expenses:read]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The raw receipt file, in its original content type
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404':
          description: No such expense for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: No valid session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            expenses:read: The caller's own saved expenses
            expenses:submit: Save a new expense with its receipt
  schemas:
    Expense:
      type: object
      required: [id, merchant, date, total, createdAt, receiptFileName, receiptContentType]
      properties:
        id: { type: string }
        merchant: { type: string }
        date: { type: string, format: date }
        total: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        receiptFileName: { type: string, description: original uploaded file name }
        receiptContentType: { type: string, description: MIME type of the uploaded receipt file }
    NewExpense:
      type: object
      required: [merchant, date, total, receiptFileName, receiptContentType, receiptData]
      properties:
        merchant: { type: string }
        date: { type: string, format: date }
        total: { type: number, format: double }
        receiptFileName: { type: string }
        receiptContentType: { type: string }
        receiptData: { type: string, format: byte, description: base64-encoded receipt file content }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
